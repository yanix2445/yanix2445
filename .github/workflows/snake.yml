# Dessine chaque jour le serpent du README de profil : il mange le graphe de contributions.
# Les deux SVG (clair et sombre) sont poussés sur la branche `output`, que le README lit.
name: Serpent des contributions

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff5b2e&color_dots=#ebedf0,#ffd3c4,#ffa585,#ff7a4d,#ff5b2e
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5b2e&color_dots=#161b22,#5c2414,#a33a1d,#d84a24,#ff5b2e

      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
